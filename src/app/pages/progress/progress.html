<div class="container mt-4">

  <h2>My Progress</h2>

  <p>
    Completed Items:
    {{ progressItems.length }}
  </p>

  <table border="1" width="100%">

    <thead>
      <tr>
        <th>Question Id</th>
        <th>Completed</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let item of progressItems">

        <td>{{ item.questionId }}</td>

        <td>{{ item.isCompleted }}</td>

      </tr>

    </tbody>

  </table>

</div>
