<div class="container mt-4">

  <h2>Interview Questions</h2>

  <p><strong>Total Questions:</strong> {{ questions.length }}</p>
  <input
  type="text"
  placeholder="Search Questions"
  [(ngModel)]="searchText"
  (input)="filterQuestions()"
  class="form-control mb-3">

  <select
  class="form-control mb-3"
  [(ngModel)]="selectedCategory"
  (change)="filterQuestions()">

  <option value="">
    All Categories
  </option>

  <option
    *ngFor="let category of categories"
    [value]="category.name">

    {{ category.name }}

  </option>

</select>

  <table border="1" cellpadding="10" cellspacing="0" width="100%">

    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Experience</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>

      <tr *ngFor="let q of questions">
        <td>{{ q.title }}</td>
        <td>{{ q.category }}</td>
        <td>{{ q.experienceLevel }}</td>
        <td>
  <button
    class="btn btn-success"
    (click)="markComplete(q.id)">
    Completed
  </button>
</td>
      </tr>

    </tbody>

  </table>

</div>
